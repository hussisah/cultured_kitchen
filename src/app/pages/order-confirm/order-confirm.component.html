<div class="confirm-container">
  <div class="confirm-card">
    <div class="icon">✅</div>

    <h2>Order Placed Successfully!</h2>

    <p class="message">
      Thank you <strong>{{ customerName }}</strong> for your order.
    </p>

    <p class="sub-message">
      Your payment is being verified. You will receive an order confirmation
      through email or WhatsApp shortly.
    </p>

    <button routerLink="/shop">
      Continue Shopping
    </button>
  </div>
</div>
